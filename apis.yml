name: Miniso
description: 'MINISO is a global value retailer of lifestyle and consumer products —
  home goods, accessories, cosmetics, stationery, toys and seasonal items — known for
  its IP-collaboration merchandise (Harry Potter, PEANUTS, Sanrio, BT21 and others).
  Founded in Guangzhou, China and publicly listed (NYSE/HKEX), the company operates
  7,700+ stores across 112 markets worldwide. Surfaced in the API Evangelist network
  as a portfolio company of Hillhouse; the public web presence is consumer- and
  investor-facing and exposes no developer API, developer portal, or partner
  integration platform at this time.'
